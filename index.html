.hm-panel{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;color:var(--text);box-shadow:var(--shadow)}
.hm-panel h3{margin:0 0 10px;font-size:14px;font-weight:850;color:var(--navy)}
.hm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.hm-row:last-child{border-bottom:0;padding-bottom:0}.hm-row span{color:var(--muted);font-weight:600;font-size:12px}
.hm-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.hm-day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font-size:10px;font-weight:700;color:var(--muted)}
.hm-bar{width:100%;border-radius:7px 7px 3px 3px;background:#e5efff;min-height:4px}
.hm-day.today{color:var(--navy)}.hm-day.today .hm-bar{background:#1769e0}.hm-day b{font-size:11px;color:var(--navy)}
.hm-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.hm-act{background:#fff;border-radius:16px;padding:14px;color:var(--navy);font-weight:850;font-size:13px;box-shadow:0 7px 20px rgba(25,51,87,.07);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.hm-act small{font-weight:600;color:var(--muted);font-size:11px}
.hm-act.hot{background:#fff7ea;color:#9a540a}.hm-act.hot small{color:#b8731f}
.hm-act:active{transform:translateY(1px)}.hm-act:focus-visible,.hm-alert:focus-visible{outline:3px solid #7fb2ff;outline-offset:2px}
.hm-alert{display:flex;justify-content:space-between;align-items:center;background:#fff7ea;border:1px solid #f6d8ad;color:#9a540a;border-radius:16px;padding:14px;font-size:13px;font-weight:800;margin-bottom:12px;cursor:pointer}
@media(min-width:700px){.hm-actions{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
let state = {
  page: 'home',
  employees: JSON.parse(localStorage.getItem('mt_employees') || '[]'),
  requests: JSON.parse(localStorage.getItem('mt_requests') || '[]'),
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  calTypeFilter: 'all',
  calEmpFilter: 'all',
  selectedDate: null,
  editEmpIdx: null,
  leaveEmpId: null,
  mtDate: null,
  repYear: null,
  repMonth: null,
  empSearch: '',
  empDeptFilter: 'all',
  empShowInactive: false,
  summaryMonth: new Date().getMonth(),
  summaryYear: new Date().getFullYear(),
  summaryEmp: 'all',
  leaveBalanceEmpId: null,
  editReqId: null
};

// Manifest kısayollarından (örn. ?page=calendar) gelen başlangıç sayfasını uygula
(function applyStartPage() {
  const params = new URLSearchParams(window.location.search);
  const p = params.get('page');
  const allowed = ['new_req', 'calendar', 'emp_list', 'reqs_pending', 'reqs_all', 'reports', 'settings', 'leave_plan_all', 'daily_status','unplanned','summary','employee_summary','unified_entry','leave_hub'];
  if (p && allowed.includes(p)) state.page = p;
})();

function save() {
  localStorage.setItem('mt_employees', JSON.stringify(state.employees));
  localStorage.setItem('mt_requests', JSON.stringify(state.requests));
}
function getMinStaff() { return parseInt(localStorage.getItem('mt_minStaff') || '0'); }
function setMinStaff(v) { localStorage.setItem('mt_minStaff', v || '0'); render(); }

const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYLAR_KISA = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const DOW_KISA = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const REQ_TYPES = ['Akşam Erken Çıkış','Mesai','Yıllık İzin','Ücretli İzin','Ücretsiz İzin','Doğum İzni','Evlilik İzni','Ölüm İzni','Sağlık/Rapor','Mazeret İzni','Diğer'];
const TYPE_ICONS = {
  'Akşam Erken Çıkış': '🕐',
  'Mesai': '💼',
  'Mesai Yok': '➖',
  'Yıllık İzin': '🏖️',
  'Ücretli İzin': '💰',
  'Ücretsiz İzin': '🚫',
  'Doğum İzni': '👶',
  'Evlilik İzni': '💍',
  'Ölüm İzni': '🖤',
  'Sağlık/Rapor': '🏥',
  'Mazeret İzni': '📄',
  'Diğer': '🔹'
};
const TYPE_COLORS = {
  'Mesai': '#7b1fa2',
  'Mesai Yok': '#9e9e9e',
  'Akşam Erken Çıkış': '#f57c00',
  'Sağlık/Rapor': '#c62828',
  'Mazeret İzni': '#616161',
  'Yıllık İzin': '#1565c0',
  'Ücretli İzin': '#2e7d32',
  'Ücretsiz İzin': '#795548',
  'Doğum İzni': '#ad1457',
  'Evlilik İzni': '#d81b60',
  'Ölüm İzni': '#212121',
  'Diğer': '#455a64'
};
const SHIFT_OPTIONS = ['1. Vardiya', '2. Vardiya', '3. Vardiya', 'Gündüz', 'Gece', '12 Saat', '8 Saat', 'Diğer'];
function shiftFieldHtml(currentValue) {
  const val = (currentValue || '').trim();
  const isPreset = SHIFT_OPTIONS.slice(0, -1).includes(val);
  const selectVal = isPreset ? val : (val ? 'Diğer' : '12 Saat');
  return `<label class="f">Vardiya</label>
      <select id="eshift" onchange="document.getElementById('eshiftCustom').style.display=this.value==='Diğer'?'block':'none'">
        ${SHIFT_OPTIONS.map(o => `<option value="${o}" ${o === selectVal ? 'selected' : ''}>${o}</option>`).join('')}
      </select>
      <input id="eshiftCustom" placeholder="Vardiya adını yazın (ör. Gece Ekibi)" value="${!isPreset ? val.replace(/"/g, '&quot;') : ''}" style="display:${selectVal === 'Diğer' ? 'block' : 'none'}">`;
}
function readShiftField() {
  const sel = document.getElementById('eshift').value;
  if (sel === 'Diğer') return (document.getElementById('eshiftCustom').value || '').trim() || 'Diğer';
  return sel;
}
const todayStr = () => { const d = new Date(); const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return local.toISOString().split('T')[0]; };

function pad(n) { return n.toString().padStart(2, '0'); }

function formatDateTR(dateStr) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${d} ${AYLAR_KISA[m - 1]} ${y}, ${GUNLER[dt.getDay()]}`;
}
function daysInclusive(start, end) {
  return Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
}
function formatRangeTR(r) {
  if (r.time && r.endTime) {
    return `${formatDateTR(r.date)}, ${r.time} – ${r.endTime}`;
  }
  if (r.endDate && r.endDate !== r.date) {
    return `${formatDateTR(r.date)} → ${formatDateTR(r.endDate)} (${daysInclusive(r.date, r.endDate)} gün)`;
  }
  return formatDateTR(r.date) + (r.time ? ' ' + r.time : '');
}
function rangeIncludes(r, dateStr) {
  const end = r.endDate || r.date;
  return dateStr >= r.date && dateStr <= end;
}
function initials(name) {
  return name.trim().split(/\s+/).map(p => p[0]).join('').toUpperCase().slice(0, 2);
}
const LEAVE_TYPES = ['Yıllık İzin', 'Ücretli İzin', 'Ücretsiz İzin', 'Doğum İzni', 'Evlilik İzni', 'Ölüm İzni', 'Sağlık/Rapor', 'Mazeret İzni'];
function isLeaveType(type) {
  return LEAVE_TYPES.includes(type);
}
function typeColor(type) { return TYPE_COLORS[type] || '#455a64'; }

function otherEmployeesOnDate(dateStr, excludeEmpId) {
  const seen = new Set();
  const names = [];
  state.requests.forEach(r => {
    if (r.emp !== excludeEmpId && r.status !== 'Reddedildi' && rangeIncludes(r, dateStr) && !seen.has(r.emp)) {
      const emp = state.employees.find(e => e.id === r.emp);
      if (emp) { seen.add(r.emp); names.push(emp.name); }
    }
  });
  return names;
}
function typeOptions(selected) {
  return REQ_TYPES.map(t => `<option ${t === selected ? 'selected' : ''}>${t}</option>`).join('');
}

// --- Görsel tür seçici (izin/talep türü bottom sheet) ---
let typePicker = { targetId: null, selected: null, title: '' };
function typeSelectButton(id, selected, title) {
  return `<label class="f">${title}</label>
    <div id="${id}" class="type-select-btn" data-value="${selected}" onclick="openTypePicker('${id}','${title}')">
      <span>${TYPE_ICONS[selected] || ''} ${selected}</span>
    </div>`;
}
function openTypePicker(targetId, title) {
  const target = document.getElementById(targetId);
  typePicker.targetId = targetId;
  typePicker.title = title;
  typePicker.selected = (target && target.dataset.value) || REQ_TYPES[0];
  renderTypePicker();
}
function renderTypePicker() {
  let overlay = document.getElementById('typePickerOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'typePickerOverlay';
    document.body.appendChild(overlay);
  }
  overlay.className = 'type-sheet-overlay';
  overlay.innerHTML = `
    <div class="type-sheet">
      <div class="type-sheet-title">${typePicker.title}</div>
      <div class="type-grid">
        ${REQ_TYPES.map(t => `
          <div class="type-card ${t === typePicker.selected ? 'selected' : ''}" onclick="selectPickerType('${t}')">
            <span class="ic">${TYPE_ICONS[t] || ''}</span>${t}
          </div>
        `).join('')}
      </div>
      <div class="type-sheet-actions">
        <button class="btn-gray" onclick="closeTypePicker()">İptal</button>
        <button class="btn-green" onclick="confirmTypePicker()">Kaydet</button>
      </div>
    </div>
  `;
}
function selectPickerType(t) { typePicker.selected = t; renderTypePicker(); }
function closeTypePicker() { const o = document.getElementById('typePickerOverlay'); if (o) o.remove(); }
function confirmTypePicker() {
  const target = document.getElementById(typePicker.targetId);
  if (target) {
    target.dataset.value = typePicker.selected;
    target.innerHTML = `<span>${TYPE_ICONS[typePicker.selected] || ''} ${typePicker.selected}</span>`;
  }
  closeTypePicker();
}
function activeEmployees() { return state.employees.filter(e => e.active !== false); }

// Bugünkü/verilen tarihteki durumu doğru sınıflara ayırır:
// Mesai ve Mesai Yok kaydı olan kişi hâlâ VARDİYADA/ÇALIŞIYOR sayılır, izinli sayılmaz.
// Sadece gerçek izin türleri (LEAVE_TYPES) "izinli" sayılır.
function todayBuckets(dateStr) {
  const emps = activeEmployees();
  const onLeave = [], working = [], mesai = [], mesaiYok = [];
  emps.forEach(e => {
    const r = state.requests.find(rq => rq.emp === e.id && rangeIncludes(rq, dateStr) && rq.status !== 'Reddedildi');
    const shift = (e.shift || '').trim() || 'Vardiya belirtilmemiş';
    if (r && isLeaveType(r.type)) {
      onLeave.push({ empId: e.id, name: e.name, sub: r.type });
    } else {
      working.push({ empId: e.id, name: e.name, sub: r ? r.type : 'Çalışıyor', shift });
      if (r && r.type === 'Mesai') mesai.push({ empId: e.id, name: e.name, sub: r.hours ? r.hours + ' saat' : '' });
      if (r && r.type === 'Mesai Yok') mesaiYok.push({ empId: e.id, name: e.name, sub: '' });
    }
  });
  const shiftCounts = {};
  working.forEach(p => { shiftCounts[p.shift] = (shiftCounts[p.shift] || 0) + 1; });
  const leaveCounts = {};
  onLeave.forEach(p => { leaveCounts[p.sub] = (leaveCounts[p.sub] || 0) + 1; });
  return { emps: emps.map(e => ({ empId: e.id, name: e.name })), onLeave, working, mesai, mesaiYok, shiftCounts, leaveCounts };
}

// Kişi listesini alt sayfa (bottom sheet) olarak gösterir; kişi sayısı çok olsa bile
// sayfa uzamaz, liste kendi içinde kaydırılır ve her kişi küçük bir buton olarak görünür.
function showPeopleSheet(title, people) {
  let overlay = document.getElementById('peopleSheetOverlay');
  if (!overlay) { overlay = document.createElement('div'); overlay.id = 'peopleSheetOverlay'; document.body.appendChild(overlay); }
  overlay.className = 'type-sheet-overlay';
  overlay.innerHTML = `
    <div class="type-sheet">
      <div class="type-sheet-title">${title} (${people.length})</div>
      <div class="people-sheet-list">
        ${people.length ? people.map(p => `<div class="people-pill" onclick="closePeopleSheet();openEmpEditById('${p.empId}')">${p.name}${p.sub ? `<span class="sub">${p.sub}</span>` : ''}</div>`).join('') : '<p class="small">Kayıt yok.</p>'}
      </div>
      <div class="type-sheet-actions"><button class="btn-gray" onclick="closePeopleSheet()">Kapat</button></div>
    </div>
  `;
}
function closePeopleSheet() { const o = document.getElementById('peopleSheetOverlay'); if (o) o.remove(); }
function openEmpEditById(empId) { const idx = state.employees.findIndex(e => e.id === empId); if (idx >= 0) openEmpEdit(idx); }
function showPeopleSheetFromState(key, title) {
  const list = (state._todayBuckets && state._todayBuckets[key]) || [];
  showPeopleSheet(title, list);
}
function showEmpMonthDetail(empId, y, m) {
  const e = state.employees.find(emp => emp.id === empId);
  if (!e) return;
  const recs = state.requests.filter(r => r.emp === empId && r.status !== 'Reddedildi' && inMonth(r, y, m)).sort((a, b) => a.date.localeCompare(b.date));
  let overlay = document.getElementById('peopleSheetOverlay');
  if (!overlay) { overlay = document.createElement('div'); overlay.id = 'peopleSheetOverlay'; document.body.appendChild(overlay); }
  overlay.className = 'type-sheet-overlay';
  overlay.innerHTML = `
    <div class="type-sheet">
      <div class="type-sheet-title">${e.name} — ${AYLAR[m]} ${y}</div>
      <div style="max-height:60vh;overflow-y:auto;margin:10px 0">
        ${recs.length ? recs.map(r => `<div class="req-line"><b>${TYPE_ICONS[r.type] || ''} ${r.type}</b>${r.type === 'Mesai' && r.hours ? ` (${r.hours} saat)` : ''}<br>${formatRangeTR(r)} <span class="pill ${r.status === 'Onaylandı' ? 'pill-plan' : 'pill-now'}">${r.status || '-'}</span>${(r.note || r.reason) ? `<br><span class="small">${r.note || r.reason}</span>` : ''}</div>`).join('') : '<p class="small">Bu ay kayıt yok.</p>'}
      </div>
      <div class="type-sheet-actions"><button class="btn-gray" onclick="closePeopleSheet()">Kapat</button></div>
    </div>
  `;
}
function showLeaveRemainingSheet() {
  const rows = activeEmployees().map(e => ({ e, inf: leaveInfo(e) }));
  let overlay = document.getElementById('peopleSheetOverlay');
  if (!overlay) { overlay = document.createElement('div'); overlay.id = 'peopleSheetOverlay'; document.body.appendChild(overlay); }
  overlay.className = 'type-sheet-overlay';
  overlay.innerHTML = `
    <div class="type-sheet">
      <div class="type-sheet-title">🏖️ İzin Kalanı (${rows.length})</div>
      <div style="max-height:60vh;overflow-y:auto;margin:10px 0">
        ${rows.length ? rows.map(({ e, inf }) => `<div class="leave-row" style="cursor:pointer" onclick="closePeopleSheet();openEmpEditById('${e.id}')"><div class="leave-name">${e.name}</div><div class="leave-mini"><div class="leave-rem">${inf.remaining === null ? '—' : inf.remaining + ' gün'}</div>${inf.entitlement !== null ? `<div class="progress"><i style="width:${Math.min(100, (inf.remaining / Math.max(inf.entitlement, 1)) * 100)}%"></i></div>` : ''}</div></div>`).join('') : '<p class="small">Personel eklenmedi.</p>'}
      </div>
      <div class="type-sheet-actions"><button class="btn-gray" onclick="closePeopleSheet()">Kapat</button></div>
    </div>
  `;
}

function leaveEmpIdsOnDate(dateStr) {
  return new Set(state.requests.filter(r => isLeaveType(r.type) && r.status === 'Onaylandı' && rangeIncludes(r, dateStr)).map(r => r.emp));
}
function workingCountForDate(dateStr) {
  return activeEmployees().length - leaveEmpIdsOnDate(dateStr).size;
}

// --- Kıdem / Yıllık izin hakkı (4857 s. Kanun m.53'e göre yaklaşık) ---
function seniorityText(hireDate) {
  if (!hireDate) return 'Belirtilmemiş';
  const now = new Date(), hd = new Date(hireDate);
  let months = (now.getFullYear() - hd.getFullYear()) * 12 + (now.getMonth() - hd.getMonth());
  if (now.getDate() < hd.getDate()) months--;
  if (months < 0) months = 0;
  return `${Math.floor(months / 12)} yıl ${months % 12} ay`;
}
function annualEntitlementForYear(hireDate, year) {
  if (!hireDate) return null;
  const hd = new Date(hireDate);
  const firstAnniversaryYear = hd.getFullYear() + 1;
  if (year < firstAnniversaryYear) return 0;
  const completedYears = year - hd.getFullYear();
  if (completedYears <= 5) return 14;
  if (completedYears < 15) return 20;
  return 26;
}
function annualEntitlement(hireDate) { return annualEntitlementForYear(hireDate, new Date().getFullYear()); }
function usedAnnualLeaveDays(empId, year) {
  return state.requests
    .filter(r => r.emp === empId && r.type === 'Yıllık İzin' && r.status === 'Onaylandı' && new Date(r.date).getFullYear() === year)
    .reduce((sum, r) => sum + daysInclusive(r.date, r.endDate || r.date), 0);
}
function usedAnnualLeaveDaysThisYear(empId) { return usedAnnualLeaveDays(empId, new Date().getFullYear()); }
function manualLeaveOpening(e, year) {
  const map = e && e.leaveManualOpening && typeof e.leaveManualOpening === 'object' ? e.leaveManualOpening : {};
  return Object.prototype.hasOwnProperty.call(map, year) ? Number(map[year]) || 0 : null;
}
function annualLeaveBalance(e, year) {
  if (!e || !e.hireDate) return {opening:0, entitlement:null, used:0, closing:null, source:'-'};
  const hdYear = new Date(e.hireDate).getFullYear();
  const manual = manualLeaveOpening(e, year);
  if (manual !== null) {
    const ent = annualEntitlementForYear(e.hireDate, year) || 0;
    const used = usedAnnualLeaveDays(e.id, year);
    return {opening:manual, entitlement:ent, used, closing:Math.max(manual + ent - used, 0), source:'Manuel açılış'};
  }
  let startYear = Number(e.leaveOpeningYear) || new Date().getFullYear();
  let opening = Number(e.leaveOpeningBalance) || 0;
  if (year < startYear) return {opening:0, entitlement:annualEntitlementForYear(e.hireDate, year) || 0, used:usedAnnualLeaveDays(e.id, year), closing:null, source:'Geçmiş yıl için manuel giriş'};
  for (let y=startYear; y<=year; y++) {
    const ent = annualEntitlementForYear(e.hireDate, y) || 0;
    const used = usedAnnualLeaveDays(e.id, y);
    const close = Math.max(opening + ent - used, 0);
    if (y === year) return {opening, entitlement:ent, used, closing:close, source:'Otomatik devir'};
    opening = close;
  }
  return {opening:0, entitlement:0, used:0, closing:0, source:'Otomatik devir'};
}
function leaveHistoryRows(e) {
  if (!e || !e.hireDate) return '';
  const start = Math.max(new Date(e.hireDate).getFullYear() + 1, Number(e.leaveOpeningYear) || new Date().getFullYear());
  const end = new Date().getFullYear();
  let rows='';
  for(let y=start;y<=end;y++){ const b=annualLeaveBalance(e,y); rows += `<tr><td>${y}</td><td>${b.opening}</td><td>${b.entitlement}</td><td>${b.used}</td><td><b>${b.closing}</b></td><td>${b.source}</td></tr>`; }
  return rows;
}
function openLeaveBalance(empId){ state.leaveBalanceEmpId=empId; state.page='leave_balance'; render(); }
function saveLeaveManualOpening(empId, year, value){
  const e=state.employees.find(x=>x.id===empId); if(!e) return;
  if(!e.leaveManualOpening) e.leaveManualOpening={};
  const n=parseFloat(value);
  if(isNaN(n) || n<0) delete e.leaveManualOpening[year]; else e.leaveManualOpening[year]=n;
  save(); render();
}
function setLeaveOpeningBase(empId, year, value){
  const e=state.employees.find(x=>x.id===empId); if(!e) return;
  const n=parseFloat(value);
  if(isNaN(n)||n<0) return alert('Geçerli bir izin bakiyesi giriniz.');
  e.leaveOpeningYear=year; e.leaveOpeningBalance=n;
  save(); render();
}

// --- Aylık istatistik (Raporlar + ana sayfa için) ---
function mesaiSaatiPerGun(r) {
  return (r.hours !== undefined && r.hours !== null && r.hours !== '' && !isNaN(parseFloat(r.hours))) ? parseFloat(r.hours) : 12;
}
function monthlyStats(empId, year, month) {
  const stats = { izinGun: 0, erken: 0, cumartesi: 0, raporlu: 0, mazeret: 0, digerIzin: 0, mesaiSaat: 0 };
  const monthStart = new Date(year, month, 1), monthEnd = new Date(year, month + 1, 0);
  state.requests.filter(r => r.emp === empId && r.status !== 'Reddedildi').forEach(r => {
    const start = new Date(r.date), end = new Date(r.endDate || r.date);
    if (end < monthStart || start > monthEnd) return;
    const overlapStart = start < monthStart ? monthStart : start;
    const overlapEnd = end > monthEnd ? monthEnd : end;
    const days = Math.round((overlapEnd - overlapStart) / 86400000) + 1;
    if (r.type === 'Yıllık İzin') stats.izinGun += days;
    else if (r.type === 'Akşam Erken Çıkış') stats.erken += days;
    else if (r.type === 'Mesai') { stats.cumartesi += days; stats.mesaiSaat += mesaiSaatiPerGun(r) * days; }
    else if (r.type === 'Sağlık/Rapor') stats.raporlu += days;
    else if (r.type === 'Mazeret İzni') stats.mazeret += days;
    else if (isLeaveType(r.type)) stats.digerIzin += days;
  });
  stats.mesaiSaat = Math.round(stats.mesaiSaat * 10) / 10;
  return stats;
}

// --- Günlük durum (Mesai Takibi matrisi) ---
function getDailyStatus(empId, dateStr) {
  const r = state.requests.find(rq => rq.emp === empId && rangeIncludes(rq, dateStr) && rq.status !== 'Reddedildi');
  if (!r) return 'Çalışıyor';
  if (r.type === 'Yıllık İzin') return 'İzinli';

function setDailyStatus(empId, dateStr, label) {

  if (existing && existing.endDate && existing.endDate !== existing.date) {
    alert('Bu tarih çok günlü bir izin planının parçası. Değiştirmek için İzin Planı sayfasından düzenleyin.');
    render();

  }
  let dsHours;

    if (input === null) { render(); return; }
    dsHours = parseFloat(input);
    if (isNaN(dsHours) || dsHours <= 0) dsHours = 12;
  }
  state.requests = state.requests.filter(r => !(r.emp === empId && r.date === dateStr && (!r.endDate || r.endDate === dateStr)));
  const map = { 'İzinli': 'Yıllık İzin', 'Erken Çıkış': 'Akşam Erken Çıkış', 'Mesai': 'Mesai', 'Mesai Yok': 'Mesai Yok', 'Raporlu': 'Sağlık/Rapor', 'Mazeret': 'Mazeret İzni' };

}

function inMonth(r,y,m){ const [a,b]=monthRange(y,m); return (r.endDate||r.date)>=a && r.date<=b; }

function leaveInfo(e){
  const y = new Date().getFullYear();
  const b = annualLeaveBalance(e, y);
  if (b.entitlement === null) return {entitlement:null,total:null,used:0,remaining:null,opening:0};

}
function saveLeaveNote(empId, value){ const e=state.employees.find(x=>x.id===empId); if(!e) return; e.leaveNote=value; save(); }
function empAnnualLeaveStatusNote(empId){
  const today = todayStr();
  const recs = state.requests.filter(r => r.emp===empId && r.type==='Yıllık İzin' && r.status!=='Reddedildi');
  const ongoing = recs.find(r => r.date <= today && (r.endDate||r.date) >= today);
  if (ongoing) return `🟢 Devam eden yıllık izin: ${formatDateTR(ongoing.date)}–${formatDateTR(ongoing.endDate||ongoing.date)}`;
  const upcoming = recs.filter(r => r.date > today).sort((a,b)=>a.date.localeCompare(b.date))[0];
  if (upcoming) return `📅 Planlanan yıllık izin: ${formatDateTR(upcoming.date)}–${formatDateTR(upcoming.endDate||upcoming.date)}`;
  return '';
}

}

function yearSummaryData(y){

}

function renderPersonTab(y,m){ const emp=state.summaryEmp||'all'; const rows=emp==='all'?summaryData(y,m):summaryData(y,m).filter(x=>x.emp===emp); return `<div class="dashboard-card"><select onchange="state.summaryEmp=this.value;render()"><option value="all">Tüm Personel</option>${activeEmployees().map(e=>`<option value="${e.id}" ${emp===e.id?'selected':''}>${e.name}</option>`).join('')}</select><div class="row2" style="margin-top:10px"><button class="btn-green" onclick="exportReportExcel(${y},${m})">📊 EXCEL'E GÖNDER</button><button onclick="exportReportCSV(${y},${m})">📥 CSV</button></div><div class="small" style="margin-top:6px">Seçili ayın Personel Özeti Excel olarak dışa aktarılır.</div></div>${renderPersonnelWideCards(rows,y,m,'person')}`; }
function renderPage() {

  if (state.page === 'unplanned') { root.innerHTML=renderUnplanned(); return; }

  if (state.page === 'home') {
    const today=todayStr(), emps=activeEmployees(), b=todayBuckets(today);

    const monthRows=summaryData(year,month), mt=k=>monthRows.reduce((a,x)=>a+x[k],0);
    const hr=now.getHours(), greet=hr<12?'Günaydın':hr<18?'İyi günler':'İyi akşamlar';
    const dateLong=now.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
    const offIds=new Set(b.onLeave.map(p=>p.empId));

    const tiles=emps.map(e=>`<div class="hm-tile ${offIds.has(e.id)?'off':''}" title="${e.name}">${ini(e.name)}</div>`).join('');
    const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const days=[...Array(7)].map((_,i)=>{const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),s=fmt(d);

    const mx=Math.max(1,...days.map(d=>d.n));

      <div class="hm-legend"><span><i></i>Çalışıyor</span><span><i class="o"></i>İzinde</span></div>

        <div class="hm-act" role="button" tabindex="0" onclick="state.page='emp_list';render()">Personeller<small>${emps.length} kişi</small></div>
        <div class="hm-act ${pending?'hot':''}" role="button" tabindex="0" onclick="state.page='reqs_pending';render()">Bekleyen Talepler<small>${pending?pending+' onay bekliyor':'Bekleyen yok'}</small></div>

        <div class="hm-act" role="button" tabindex="0" onclick="state.page='leave_hub';render()">Yıllık İzin Planı<small>Plan ve onay</small></div>

        <div class="hm-act" role="button" tabindex="0" onclick="state.page='reqs_all';render()">Tüm Kayıtlar<small>Geçmiş liste</small></div>
      </div>

        ${isUnp ? `
          <label class="f">Neden / kısa açıklama</label>
          <input id="erreason" placeholder="Neden" value="${(r.reason||'').replace(/"/g,'&quot;')}">
          <label class="f">Bildirim</label>
          <select id="ernotify">${['Telefon','WhatsApp / Mesaj','Yüz yüze','Başka personel bildirdi','Bildirilmedi'].map(o=>`<option ${o===r.notifyMethod?'selected':''}>${o}</option>`).join('')}</select>
        ` : ''}
        <input id="ernote" placeholder="Açıklama / not" value="${(r.note||'').replace(/"/g,'&quot;')}">
        <button class="btn-green" onclick="saveReqEdit()">💾 DEĞİŞİKLİKLERİ KAYDET</button>
        <button class="btn-gray" onclick="cancelReqEdit()">⬅ İptal</button>
      </div>
    `;

  } else if (state.page.startsWith('reqs_')) {
    const isPending = state.page === 'reqs_pending';
    let filtered = state.requests.filter(r => isPending ? r.status === 'Bekliyor' : true)
      .sort((a, b) => a.date.localeCompare(b.date));
    let list = filtered.map(r => renderReqCard(r, state.page)).join('');
    root.innerHTML = `
      <h2>${isPending ? 'BEKLEYEN TALEPLER' : 'TÜM TALEPLER'}</h2>
      ${list || '<p>Kayıt bulunamadı.</p>'}
      <button class="btn-gray" onclick="state.page='home';render()">⬅ Ana Sayfa</button>
    `;

  } else if (state.page === 'calendar') {
    root.innerHTML = renderCalendar();

  } else if (state.page === 'day_detail') {
    let matches = state.requests.filter(r => rangeIncludes(r, state.selectedDate))
      .sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    let list = matches.map(r => renderReqCard(r, 'day_detail')).join('');

    let bookedEmpIds = new Set(matches.map(r => r.emp));
    let freeEmployees = state.employees.filter(e => !bookedEmpIds.has(e.id));
    let quickList = freeEmployees.map(e => `
      <div class="quick-row">
        <span style="flex:1">${e.name}</span>
        <select id="qtype_${e.id}">${typeOptions()}</select>
        <button class="btn-green" onclick="quickAdd('${e.id}')">✅ Ekle</button>
      </div>
    `).join('');

    const uniqueCount = new Set(matches.map(r => r.emp)).size;
    const activeCount = activeEmployees().length;
    const leaveCount = leaveEmpIdsOnDate(state.selectedDate).size;
    const workingCount = activeCount - leaveCount;
    const minStaff = getMinStaff();
    const understaffed = minStaff > 0 && workingCount < minStaff;

    root.innerHTML = `
      <h2>${formatDateTR(state.selectedDate)}</h2>
      ${understaffed ? `<div class="danger-box">🔴 VARDİYA UYARISI: Çalışan sayısı (${workingCount}) minimum seviyenin (${minStaff}) altında! (Toplam: ${activeCount}, İzinli: ${leaveCount})</div>` : (uniqueCount > 1 ? `<div class="warn-box">⚠ Bu tarihte ${uniqueCount} farklı çalışan var, çakışma olabilir.</div>` : '')}
      ${list || '<p>Bu tarihte kayıt yok.</p>'}
      ${freeEmployees.length ? `
        <div class="card">
          <b>Hızlı İşaretle</b> <small>(tür seç, onaylı olarak eklenir)</small>
          ${quickList}
        </div>
      ` : ''}
      <button class="btn-green" onclick="state.page='new_req';render()">➕ Detaylı Talep Ekle</button>
      <button class="btn-gray" onclick="state.page='calendar';render()">⬅ Takvime Dön</button>
    `;

  } else if (state.page === 'reports') {
    const y = state.repYear || new Date().getFullYear();
    const m = state.repMonth != null ? state.repMonth : new Date().getMonth();
    let rows = activeEmployees().map(e => {
      const s = monthlyStats(e.id, y, m);
      return `
        <div class="card">
          <b>${e.name}</b><br>
          <small>Yıllık İzin: ${s.izinGun} gün | Erken Çıkış: ${s.erken} gün | Mesai: ${s.cumartesi} gün | Sağlık/Rapor: ${s.raporlu} gün | Mazeret: ${s.mazeret} gün | Diğer İzin: ${s.digerIzin} gün</small><br>
          <small><b>Toplam Ekstra Mesai: ${s.mesaiSaat} saat</b></small>
        </div>
      `;
    }).join('');
    const monthOpts = AYLAR.map((a, i) => `<option value="${i}" ${i === m ? 'selected' : ''}>${a}</option>`).join('');
    root.innerHTML = `
      <h2>RAPORLAR</h2>
      <div class="row2">
        <select onchange="state.repMonth=parseInt(this.value);render()">${monthOpts}</select>
        <input type="number" value="${y}" onchange="state.repYear=parseInt(this.value);render()">
      </div>
      <div class="row2"><button class="btn-green" onclick="exportReportExcel(${y},${m})">📊 Excel (.xls)</button><button onclick="exportReportCSV(${y},${m})">📥 CSV</button></div>
      ${rows || '<p>Aktif personel yok.</p>'}
      <button class="btn-gray" onclick="state.page='home';render()">⬅ Ana Sayfa</button>
    `;

  } else if (state.page === 'leave_balance') {
    const e = state.employees.find(x => x.id === state.leaveBalanceEmpId);
    const yNow = new Date().getFullYear();
    if (!e) { state.page='emp_list'; render(); return; }
    const b = annualLeaveBalance(e, yNow);
    const manualEntries = Object.keys(e.leaveManualOpening || {}).sort((a,b)=>Number(b)-Number(a));
    root.innerHTML = `
      <h2>🏖️ İZİN BAKİYESİ — ${e.name}</h2>
      <div class="hero"><h2>${b.closing ?? '-'} gün</h2><div class="small">Bu yıl kalan yıllık izin</div></div>
      <div class="stat-grid"><div class="stat">↩️<b>${b.opening}</b><span class="small">Devir / Açılış</span></div><div class="stat">➕<b>${b.entitlement ?? 0}</b><span class="small">Bu yıl hak</span></div><div class="stat">➖<b>${b.used}</b><span class="small">Bu yıl kullanılan</span></div></div>
      <div class="card"><b>⚙️ Manuel düzeltme</b><p class="small">İlk kurulumda mevcut devir bakiyesini buradan elle girebilirsin. Bir yıl için manuel açılış girilirse o yılın hesabı bu değerden başlar.</p>
        <div class="row2"><input id="lbYear" type="number" value="${yNow}"><input id="lbValue" type="number" min="0" step="0.5" value="${manualLeaveOpening(e,yNow) ?? b.opening}"></div>
        <button class="btn-orange" onclick="saveLeaveManualOpening('${e.id}',parseInt(document.getElementById('lbYear').value),document.getElementById('lbValue').value)">💾 Bu Yılın Açılışını Manuel Kaydet</button>
      </div>
      <div class="card table-wrap"><b>📆 Yıllara göre izin hareketi</b><table class="mini-table"><tr><th>Yıl</th><th>Devir</th><th>Hak</th><th>Kullanılan</th><th>Kalan</th><th>Hesap</th></tr>${leaveHistoryRows(e) || '<tr><td colspan=6>İşe giriş tarihi yok.</td></tr>'}</table></div>
      ${manualEntries.length ? `<div class="card"><b>✏️ Manuel girişler</b>${manualEntries.map(y=>`<div class="req-line"><b>${y}</b> yılı açılış: ${e.leaveManualOpening[y]} gün <button class="btn-gray" style="padding:5px" onclick="saveLeaveManualOpening('${e.id}',${y},'')">Sil</button></div>`).join('')}</div>` : ''}
      <button class="btn-gray" onclick="state.page='emp_list';render()">⬅ Personellere Dön</button>
    `;
  } else if (state.page === 'settings') {
    root.innerHTML = `
      <h2>AYARLAR</h2>
      <div class="card">
        <label class="f">Vardiya için minimum çalışan sayısı (0 = kapalı)</label>
        <input type="number" min="0" value="${getMinStaff()}" onchange="setMinStaff(this.value)">
        <small>Bir günde çalışan sayısı bu değerin altına düşerse gün ekranında ve takvimde uyarı gösterilir.</small>
      </div>
      <div class="card">
        <b>Yedekleme</b><br><br>
        <button class="btn-green" onclick="exportBackup()">📤 Verileri Yedekle (.json)</button>
        <label class="f">Yedek Dosyasını Yükle</label>
        <input type="file" accept="application/json" onchange="importBackupFile(this)">
      </div>
      <div class="card">
        <button class="btn-red" onclick="wipeAllData()">🗑️ Tüm Verileri Sil</button>
      </div>
      <button class="btn-gray" onclick="state.page='home';render()">⬅ Ana Sayfa</button>
    `;
  }
}

// --- Telefonun "Geri" tuşu desteği ---
// Sayfa geçmişi tarayıcı geçmişine (History API) yazılır; telefonun geri tuşu
// veya kaydırma jesti ile bir önceki ekrana dönülebilir, uygulamadan çıkılmaz.
let _navSyncing = false;
let _initialHistorySet = false;
function stateSnapshot() {
  const s = { ...state };
  delete s.employees;
  delete s.requests;
  return s;
}
function syncHistory() {
  if (_navSyncing) return;
  const snapshot = stateSnapshot();
  if (!_initialHistorySet) {
    history.replaceState(snapshot, '', '#' + state.page);
    _initialHistorySet = true;
    return;
  }
  const cur = history.state;
  if (!cur || cur.page !== state.page) {
    history.pushState(snapshot, '', '#' + state.page);
  } else {
    history.replaceState(snapshot, '', '#' + state.page);
  }
}
function render() {
  renderPage();
  document.body.classList.add('has-bottom-nav');
  renderBottomNav();
  syncHistory();
}

function goNav(page){
  if(page==='more'){showMoreMenu();return;}
  state.page=page;
  if(page==='summary') state.summaryTab='monthly';
  render();
}
function renderBottomNav(){
  const app=document.getElementById('app');
  document.querySelectorAll('.bottom-nav').forEach(n=>n.remove());
  const p=state.page;
  const active=x=>p===x?'active':'';
  app.insertAdjacentHTML('beforeend',`<nav class="bottom-nav">
    <button class="${active('home')}" onclick="goNav('home')"><span class="nav-ic">⌂</span>Ana Sayfa</button>
    <button class="${active('unified_entry')}" onclick="goNav('unified_entry')"><span class="nav-ic">＋</span>Kayıt</button>
    <button class="${active('calendar')}" onclick="goNav('calendar')"><span class="nav-ic">□</span>Takvim</button>
    <button class="${active('summary')}" onclick="goNav('summary')"><span class="nav-ic">▥</span>Özet</button>
    <button class="${active('settings')}" onclick="goNav('settings')"><span class="nav-ic">⚙</span>Ayarlar</button>
  </nav>`);
}
function showMoreMenu(){
  document.querySelectorAll('.more-sheet').forEach(x=>x.remove());
  document.body.insertAdjacentHTML('beforeend',`<div class="more-sheet" onclick="if(event.target===this)this.remove()"><div class="more-panel">
    <h3>Daha Fazla</h3>
    <div class="more-grid">
      <button onclick="this.closest('.more-sheet').remove();state.page='leave_hub';render()">🏖️ Yıllık İzin Planı</button>
      <button onclick="this.closest('.more-sheet').remove();state.page='reqs_pending';render()">🔔 Bekleyen Talepler</button>
      <button onclick="this.closest('.more-sheet').remove();state.page='reqs_all';render()">📋 Tüm Kayıtlar</button>
      <button onclick="this.closest('.more-sheet').remove();state.page='daily_status';render()">🕐 Bugün / Vardiya</button>
      <button onclick="this.closest('.more-sheet').remove();state.page='annual_leave_summary';render()">🏖️ İzin Özeti</button>
      <button onclick="this.closest('.more-sheet').remove();state.page='settings';render()">⚙️ Ayarlar</button>
    </div><button class="more-close" onclick="this.closest('.more-sheet').remove()">Kapat</button>
  </div></div>`);
}
window.addEventListener('popstate', (e) => {
  _navSyncing = true;
  if (e.state) {
    Object.assign(state, e.state);
  } else {
    state.page = 'home';
  }
  renderPage();
  _navSyncing = false;
});

function renderReqCard(r, returnPage) {
  let emp = state.employees.find(e => e.id === r.emp);
  return `
    <div class="card">
      <b>${emp ? emp.name : 'Silinmiş Çalışan'}</b><br>
      ${r.type}${r.type === 'Mesai' && r.hours ? ' (' + r.hours + ' saat)' : ''} | ${formatRangeTR(r)}<br>
      Durum: <span class="badge">${r.status}</span> ${r.used ? '☑ KULLANILDI' : ''}<br>
      <small>${r.note || ''}</small>
      ${r.status === 'Bekliyor' ? `
        <div class="row2" style="margin-top:6px">
          <button class="btn-green" onclick="setReqStatus('${r.id}','Onaylandı')">✅ Onayla</button>
          <button class="btn-red" onclick="setReqStatus('${r.id}','Reddedildi')">❌ Reddet</button>
        </div>
      ` : ''}
      ${r.status === 'Onaylandı' ? `
        <button style="padding:6px;margin-top:6px" onclick="toggleUsed('${r.id}')">${r.used ? '☐ Kullanılmadı olarak işaretle' : '☑ Kullanıldı olarak işaretle'}</button>
      ` : ''}
      <div class="row2" style="margin-top:6px">
        <button class="btn-gray" style="padding:7px;font-size:12px" onclick="openReqEdit('${r.id}','${returnPage || 'reqs_all'}')">✏️ Düzenle</button>
        <button class="btn-red" style="padding:7px;font-size:12px" onclick="deleteReq('${r.id}')">🗑 Sil</button>
      </div>
    </div>
  `;
}

function renderCalendar() {
  const y = state.calYear, m = state.calMonth;
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayStr();
  const minStaff = getMinStaff();

  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${pad(m + 1)}-${pad(d)}`;
    let matches = state.requests.filter(r => rangeIncludes(r, dateStr));
    if (state.calTypeFilter !== 'all') matches = matches.filter(r => r.type === state.calTypeFilter);
    if (state.calEmpFilter !== 'all') matches = matches.filter(r => r.emp === state.calEmpFilter);

    const isToday = dateStr === today;
    const uniqueEmpCount = new Set(state.requests.filter(r => rangeIncludes(r, dateStr)).map(r => r.emp)).size;
    const understaffed = minStaff > 0 && workingCountForDate(dateStr) < minStaff;

    let dots = '';
    matches.slice(0, 5).forEach(r => {
      let emp = state.employees.find(e => e.id === r.emp);
      let label = emp ? initials(emp.name) : '?';
      let strike = r.status === 'Reddedildi' ? 'text-decoration:line-through;opacity:.6;' : '';
      let prefix = r.status === 'Bekliyor' ? '⏳' : '';
      if (isLeaveType(r.type)) {
        dots += `<span class="cal-dot" style="background:${typeColor(r.type)};cursor:pointer;${strike}" onclick="event.stopPropagation();toggleUsed('${r.id}')">${r.used ? '☑' : '☐'}${label}</span>`;
      } else {
        dots += `<span class="cal-dot" style="background:${typeColor(r.type)};${strike}" title="${r.type}${r.type === 'Mesai' && r.hours ? ' - ' + r.hours + ' saat' : ''}">${prefix}${label}</span>`;
      }
    });
    if (matches.length > 5) dots += `<span class="cal-dot" style="background:#999">+${matches.length - 5}</span>`;

    cells += `
      <div class="cal-day ${matches.length ? 'has-req' : ''} ${isToday ? 'today' : ''}"
        ${matches.length ? `onclick="viewDay('${dateStr}')"` : ''}>
        ${understaffed ? `<span class="cal-warn" style="color:#c62828">🔴</span>` : (uniqueEmpCount > 1 ? `<span class="cal-warn">⚠</span>` : '')}
        <div class="cal-daynum">${d}</div>
        <div class="cal-dots">${dots}</div>
      </div>
    `;
  }

  const dow = DOW_KISA.map(d => `<div class="cal-dow">${d}</div>`).join('');
  const typeFilterOpts = `<option value="all">Tüm Türler</option>` + REQ_TYPES.map(t => `<option ${state.calTypeFilter === t ? 'selected' : ''}>${t}</option>`).join('');
  const empFilterOpts = `<option value="all">Tüm Çalışanlar</option>` + state.employees.map(e => `<option value="${e.id}" ${state.calEmpFilter === e.id ? 'selected' : ''}>${e.name}</option>`).join('');

  return `
    <h2>TAKVİM</h2>
    <div class="cal-header">
      <button class="btn-gray" onclick="shiftMonth(-1)">◀</button>
      <span class="cal-title">${AYLAR[m]} ${y}</span>
      <button class="btn-gray" onclick="shiftMonth(1)">▶</button>
    </div>
    <div class="cal-filters">
      <select onchange="state.calTypeFilter=this.value;render()">${typeFilterOpts}</select>
      <select onchange="state.calEmpFilter=this.value;render()">${empFilterOpts}</select>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
    <div class="card" style="font-size:12px">
      <span class="cal-dot" style="background:${typeColor('Yıllık İzin')}">☐AB</span> Yıllık İzin &nbsp;
      <span class="cal-dot" style="background:${typeColor('Akşam Erken Çıkış')}">AB</span> Erken Çıkış &nbsp;
      <span class="cal-dot" style="background:${typeColor('Mesai')}">AB</span> Mesai<br>
      <span class="cal-dot" style="background:${typeColor('Sağlık/Rapor')}">AB</span> Sağlık/Rapor &nbsp;
      <span class="cal-dot" style="background:${typeColor('Mazeret İzni')}">AB</span> Mazeret İzni<br>
      ⏳ Bekliyor &nbsp; ⚠ Birden fazla kişi &nbsp; 🔴 Personel açığı riski
    </div>
    <button class="btn-gray" onclick="state.page='home';render()">⬅ Ana Sayfa</button>
  `;
}

function shiftMonth(delta) {
  state.calMonth += delta;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  render();
}
function viewDay(dateStr) { state.selectedDate = dateStr; state.page = 'day_detail'; render(); }
function openEmpEdit(idx) { state.editEmpIdx = idx; state.page = 'emp_edit'; render(); }
function openLeaveAdd(empId) { state.leaveEmpId = empId; state.page = 'leave_add'; render(); }
function openLeaveList(empId) { state.leaveEmpId = empId; state.page = 'leave_list'; render(); }
function openReqEdit(id, returnPage) {
  if (!state.requests.some(r => r.id === id)) return;
  state.editReqId = id;
  state.editReqReturnPage = returnPage || 'reqs_all';
  state.page = 'req_edit';
  render();
}
function cancelReqEdit() {
  state.editReqId = null;
  state.page = state.editReqReturnPage || 'reqs_all';
  render();
}
function saveReqEdit() {
  const r = state.requests.find(x => x.id === state.editReqId);
  if (!r) return;
  const emp = document.getElementById('eremp').value;
  const start = document.getElementById('erdate').value;
  const end = document.getElementById('erend').value || start;
  if (!emp || !start) return alert('Personel ve başlangıç tarihi giriniz.');
  if (end < start) return alert('Bitiş tarihi başlangıç tarihinden önce olamaz.');
  r.emp = emp; r.date = start; r.endDate = end;
  if (r.type !== 'Yıllık İzin') {
    const typeEl = document.getElementById('ertype');
    if (typeEl) r.type = typeEl.value;
  }
  const hours = parseFloat(document.getElementById('erhours').value);
  if (r.type === 'Mesai' && !isNaN(hours) && hours > 0) r.hours = hours;
  const reasonEl = document.getElementById('erreason');
  if (reasonEl) r.reason = reasonEl.value.trim();
  const notifyEl = document.getElementById('ernotify');
  if (notifyEl) r.notifyMethod = notifyEl.value;
  r.note = document.getElementById('ernote').value.trim();
  save(); state.editReqId = null; state.page = state.editReqReturnPage || 'reqs_all'; render();
}

function checkDateWarning() {
  const dateEl = document.getElementById('rdate');
  const empEl = document.getElementById('remp');
  const box = document.getElementById('dateWarning');
  if (!dateEl || !empEl || !box) return;
  const others = otherEmployeesOnDate(dateEl.value, empEl.value);
  box.innerHTML = others.length ? `<div class="warn-box">⚠ Bu tarihte zaten kayıtlı: ${others.join(', ')}</div>` : '';
}

function addEmp() {
  let name = document.getElementById('ename').value.trim();
  if (!name) return alert('Ad Soyad giriniz');
  state.employees.push({
    id: Date.now().toString(),
    name,
    sicil: document.getElementById('esicil').value,
    dept: document.getElementById('edept').value,
    title: document.getElementById('etitle').value,
    shift: readShiftField(),
    phone: document.getElementById('ephone').value,
    hireDate: document.getElementById('ehire').value,
    active: document.getElementById('eactive').value !== 'false',
    leaveOpeningBalance: parseFloat(document.getElementById('eleaveopening').value) || 0,
    leaveOpeningYear: parseInt(document.getElementById('eleaveyear').value) || new Date().getFullYear(),
    leaveManualOpening: {}
  });
  save(); state.page = 'emp_list'; render();
}
function saveEmpEdit() {
  const e = state.employees[state.editEmpIdx];
  if (!e) return;
  const name = document.getElementById('ename').value.trim();
  if (!name) return alert('Ad Soyad giriniz');
  e.name = name;
  e.sicil = document.getElementById('esicil').value;
  e.dept = document.getElementById('edept').value;
  e.title = document.getElementById('etitle').value;
  e.shift = readShiftField();
  e.phone = document.getElementById('ephone').value;
  e.hireDate = document.getElementById('ehire').value;
  e.active = document.getElementById('eactive').value !== 'false';
  e.leaveOpeningBalance = parseFloat(document.getElementById('eleaveopening').value) || 0;
  e.leaveOpeningYear = parseInt(document.getElementById('eleaveyear').value) || new Date().getFullYear();
  if(!e.leaveManualOpening) e.leaveManualOpening = {};
  save(); state.page = 'emp_list'; render();
}
function deleteEmp(idx) {
  if (!confirm('Bu çalışanı ve tüm kayıtlarını silmek istediğinize emin misiniz?')) return;
  const emp = state.employees[idx];
  state.requests = state.requests.filter(r => r.emp !== emp.id);
  state.employees.splice(idx, 1);
  save(); render();
}

function addReq() {
  const empId = document.getElementById('remp').value;
  const dateVal = document.getElementById('rdate').value;
  const others = otherEmployeesOnDate(dateVal, empId);
  if (others.length > 0) {
    const ok = confirm(`⚠ Bu tarihte zaten ${others.length} çalışan var: ${others.join(', ')}.\n\nYine de eklemek istiyor musunuz?`);
    if (!ok) return;
  }
  const rHoursVal = parseFloat(document.getElementById('rhours').value);
  state.requests.push({
    id: Date.now().toString(),
    emp: empId,
    type: document.getElementById('rtype').dataset.value,
    date: dateVal,
    time: document.getElementById('rtime').value,
    note: document.getElementById('rnote').value,
    status: 'Bekliyor',
    used: false,
    planned: true,
    eventClass: 'planli',
    hours: (!isNaN(rHoursVal) && rHoursVal > 0) ? rHoursVal : 12,
    createdAt: new Date().toISOString()
  });
  save(); state.page = 'home'; render();
}

function quickAdd(empId) {
  const type = document.getElementById('qtype_' + empId).value;
  const dateVal = state.selectedDate;
  const others = otherEmployeesOnDate(dateVal, empId);
  if (others.length > 0) {
    const ok = confirm(`⚠ Bu tarihte zaten ${others.length} çalışan var: ${others.join(', ')}.\n\nYine de eklemek istiyor musunuz?`);
    if (!ok) return;
  }
  let qHours;
  if (type === 'Mesai') {
    const input = prompt('Kaç saat mesai yapıldı?', '12');
    if (input === null) return;
    qHours = parseFloat(input);
    if (isNaN(qHours) || qHours <= 0) qHours = 12;
  }
  state.requests.push({ id: Date.now().toString(), emp: empId, type, date: dateVal, time: '', note: '', status: 'Onaylandı', used: false, hours: type === 'Mesai' ? qHours : undefined });
  save(); render();
}

function saveLeave() {
  const empSel = document.getElementById('lpemp');
  const empId = empSel ? empSel.value : state.leaveEmpId;
  const type = document.getElementById('lvtype').dataset.value;
  const start = document.getElementById('lvstart').value;
  const end = document.getElementById('lvend').value || start;
  if (!start) return alert('Başlangıç tarihi giriniz');
  if (end < start) return alert('Bitiş tarihi başlangıçtan önce olamaz');
  state.requests.push({
    id: Date.now().toString(), emp: empId, type, date: start, endDate: end,
    time: '', note: document.getElementById('lvnote').value, status: 'Onaylandı', used: false
  });
  save();
  state.page = empSel ? 'leave_plan_all' : 'leave_list';
  render();
}

function deleteReq(id) {
  if (!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
  state.requests = state.requests.filter(r => r.id !== id);
  save(); render();
}
function setReqStatus(id, status) {
  let req = state.requests.find(r => r.id === id);
  if (req) { req.status = status; save(); render(); }
}
function toggleUsed(id) {
  let req = state.requests.find(r => r.id === id);
  if (req) { req.used = !req.used; save(); render(); }
}

// --- Raporlar: CSV / Excel dışa aktarma ---
function exportReportCSV(year, month) {
  let rows = [['Ad Soyad','Devir (gün)','Yıllık Hak (gün)','Yıllık İzin Kullanılan (gün)','Kalan İzin (gün)','Erken Çıkış (gün)','Mesai (gün)','Sağlık/Rapor (gün)','Mazeret (gün)','Diğer İzin (gün)','Toplam Mesai (saat)']];
  activeEmployees().forEach(e => { const b=annualLeaveBalance(e,year); const s=monthlyStats(e.id,year,month); rows.push([e.name,b.opening,b.entitlement??'',b.used,b.closing??'',s.erken,s.cumartesi,s.raporlu,s.mazeret,s.digerIzin,s.mesaiSaat]); });
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replaceAll('"','""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' }); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`personel_ozet_${AYLAR[month]}_${year}.csv`; a.click(); URL.revokeObjectURL(url);
}
function exportReportExcel(year, month) {
  const rows=[['PERSONEL ÖZETİ',`${AYLAR[month]} ${year}`],[],['Ad Soyad','Devir','Yıllık Hak','Yıllık İzin Kullanılan','Kalan İzin','Erken Çıkış','Mesai Günü','Sağlık/Rapor','Mazeret','Diğer İzin','Toplam Mesai Saat']];
  activeEmployees().forEach(e=>{const b=annualLeaveBalance(e,year),s=monthlyStats(e.id,year,month); rows.push([e.name,b.opening,b.entitlement??'',b.used,b.closing??'',s.erken,s.cumartesi,s.raporlu,s.mazeret,s.digerIzin,s.mesaiSaat]);});
  const table=rows.map((r,i)=>`<tr>${r.map(v=>`<td>${String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</td>`).join('')}</tr>`).join('');
  const html=`<html><head><meta charset="UTF-8"><style>table{border-collapse:collapse;font-family:Arial}td{border:1px solid #999;padding:7px}tr:nth-child(1) td{font-weight:bold;background:#eaf2ff}tr:nth-child(3) td{font-weight:bold;background:#dbeafe}</style></head><body><table>${table}</table></body></html>`;
  const blob=new Blob(['\uFEFF',html],{type:'application/vnd.ms-excel'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`personel_ozet_${AYLAR[month]}_${year}.xls`; a.click(); URL.revokeObjectURL(url);
}

// --- Yedekleme ---
function exportBackup() {
  const data = JSON.stringify({ employees: state.employees, requests: state.requests, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `personel_yedek_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
}
function importBackupFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.employees) || !Array.isArray(data.requests)) throw new Error('geçersiz');
      if (!confirm('Mevcut veriler yedek dosyasındaki verilerle değiştirilecek. Emin misiniz?')) return;
      state.employees = data.employees;
      state.requests = data.requests;
      save();
      alert('Yedek başarıyla yüklendi.');
      render();
    } catch (err) {
      alert('Geçersiz yedek dosyası.');
    }
  };
  reader.readAsText(file);
}
function wipeAllData() {
  if (!confirm('TÜM veriler silinecek. Bu işlem geri alınamaz. Emin misiniz?')) return;
  if (!confirm('Son kez soruyorum: gerçekten tüm personel ve talep kayıtlarını silmek istiyor musunuz?')) return;
  state.employees = []; state.requests = []; save(); render();
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
